name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore: [ "docs/**" ]   # the docs site: Cloudflare Pages builds it
  pull_request:
    branches: [ "master" ]
    paths-ignore: [ "docs/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack (verify the package builds)
        run: dotnet pack src/EasyEcs.Core/EasyEcs.Core.csproj --no-build --configuration Release --output artifacts
