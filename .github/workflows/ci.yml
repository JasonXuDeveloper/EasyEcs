name: CI

on:
  push:
    branches: [ "master" ]
    paths: [ "**", "!docs/**", "docs/content/**" ]   # the docs site itself: Cloudflare Pages builds it
  pull_request:
    branches: [ "master" ]
    paths: [ "**", "!docs/**", "docs/content/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack (verify the package builds)
        run: dotnet pack src/EasyEcs.Core/EasyEcs.Core.csproj --no-build --configuration Release --output artifacts
      - name: Run the samples
        run: |
          dotnet run --no-build -c Release --project samples/HelloWorld
          dotnet run --no-build -c Release --project samples/GameLoop -- --ticks 30
          dotnet run --no-build -c Release --project samples/SaveLoad
          dotnet run --no-build -c Release --project samples/MultiWorld -- --updates 50
          dotnet run --no-build -c Release --project samples/HotReload/HotReload.Host
      - name: Install the wasm-tools workload (the live demo is published with Mono AOT)
        run: dotnet workload install wasm-tools
      - name: Publish the docs site's live demo (demo/EasyEcs.Demo, WebAssembly, Mono AOT)
        run: dotnet publish demo/EasyEcs.Demo/EasyEcs.Demo.csproj -c Release -o artifacts/demo
      - name: API reference is up to date, in English and Chinese (tools/ApiDocs)
        run: |
          # exits with 1 when a Chinese entry (tools/ApiDocs/zh/) is missing, stale or orphaned
          dotnet run --no-build -c Release --project tools/ApiDocs
          if [ -n "$(git status --porcelain -- docs/content/reference)" ]; then
            git status --porcelain -- docs/content/reference
            echo "::error::docs/content/reference is stale: run 'dotnet run --project tools/ApiDocs' and commit the pages"
            exit 1
          fi

  doc-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile the C# snippets of the docs (tools/DocCheck)
        run: dotnet run -c Release --project tools/DocCheck

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet new easyecs from the packed templates, against the packed EasyEcs
        run: templates/smoke.sh
