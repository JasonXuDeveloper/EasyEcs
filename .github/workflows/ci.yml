name: CI

on:
  push:
    branches: [ "master" ]
    paths: [ "**", "!docs/**", "docs/content/**" ]   # the docs site itself: Cloudflare Pages builds it
  pull_request:
    branches: [ "master" ]
    paths: [ "**", "!docs/**", "docs/content/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test (every test project on net10.0 and net11.0)
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Every generated job is inlined by its runner on both runtimes (tools/perf/inlining.sh; the JIT inlines no method of more than 32 IL locals)
        run: |
          FRAMEWORK=net10.0 tools/perf/inlining.sh --no-build
          FRAMEWORK=net11.0 tools/perf/inlining.sh --no-build
      - name: Pack (verify the package builds)
        run: dotnet pack src/EasyEcs.Core/EasyEcs.Core.csproj --no-build --configuration Release --output artifacts
      - name: Run the samples (the deterministic ones must print their README's expected output)
        env:
          DOTNET_RUN_OPTIONS: --no-build
        run: |
          .github/scripts/check-sample.sh samples/HelloWorld
          # GameLoop's times and message counts depend on timing: numbers are masked, its lines and system names are checked
          SAMPLE_MASK='s/ *[0-9]+(\.[0-9]+)?/ N/g' .github/scripts/check-sample.sh samples/GameLoop --ticks 30
          .github/scripts/check-sample.sh samples/SaveLoad
          .github/scripts/check-sample.sh samples/MultiWorld
          .github/scripts/check-sample.sh samples/HotReload
          .github/scripts/check-sample.sh samples/Actors
          .github/scripts/check-sample.sh samples/VoxelServer
      - name: Install the wasm-tools-net10 workload (the live demo targets net10.0 and is published with Mono AOT)
        run: dotnet workload install wasm-tools-net10
      - name: Publish the docs site's live demo (demo/EasyEcs.Demo, WebAssembly, Mono AOT)
        run: dotnet publish demo/EasyEcs.Demo/EasyEcs.Demo.csproj -c Release -o artifacts/demo
      - name: API reference is up to date, in English and Chinese (tools/docs/ApiDocs)
        run: |
          # exits with 1 when a Chinese entry (tools/docs/ApiDocs/zh/) is missing, stale or orphaned
          dotnet run --no-build -c Release --project tools/docs/ApiDocs
          if [ -n "$(git status --porcelain -- docs/content/reference)" ]; then
            git status --porcelain -- docs/content/reference
            echo "::error::docs/content/reference is stale: run 'dotnet run --project tools/docs/ApiDocs' and commit the pages"
            exit 1
          fi

  arm64:
    # Every vector form must run on ARM64 (NEON); the 128-bit paths are tested here on real AdvSimd hardware.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build
        run: dotnet build tests/EasyEcs.UnitTest --configuration Release
      - name: Test
        run: dotnet test tests/EasyEcs.UnitTest --no-build --configuration Release
      - name: The loop each [ForEach] method of the tests runs on ARM64 (a form left to rows says "rows on this hardware")
        run: dotnet test tests/EasyEcs.UnitTest --no-build --configuration Release --filter "Name=EveryVectorFormRunsAsAVectorLoopOnARM64" --logger "console;verbosity=detailed"
      - name: The prefetch this runner issues (SVE's PRFB where SVE is hardware; PrefetchTests ran its twins with the gate forced on)
        run: dotnet test tests/EasyEcs.UnitTest --no-build --configuration Release --filter "Name=ThePrefetchIsTheMachines" --logger "console;verbosity=detailed"
      - name: Every generated job is inlined by its runner on ARM64, on both runtimes (tools/perf/inlining.sh)
        run: |
          FRAMEWORK=net10.0 tools/perf/inlining.sh
          FRAMEWORK=net11.0 tools/perf/inlining.sh

  doc-snippets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Agent instructions are indexed and complete (tools/agents.sh)
        run: tools/agents.sh --check
      - uses: actions/setup-node@v6
        with:
          node-version-file: docs/.node-version
      - name: The public skills list holds only easyecs (every development skill has metadata.internal true)
        run: |
          out=$(npx -y skills@1.7.6 add . --list 2>&1 | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g')
          echo "$out"
          if ! echo "$out" | grep -q 'Found 1 skill$' || ! echo "$out" | grep -qE '\beasyecs\s*$'; then
            echo "::error::'npx skills add . --list' must list only easyecs: give the new skill metadata.internal: true"
            exit 1
          fi
      - name: The committed live demo was built from these sources (docs/public/demo/source.sha256, written by build-demo.sh)
        run: |
          if [ "$(docs/scripts/demo-source.sh)" != "$(cat docs/public/demo/source.sha256)" ]; then
            echo "::error::docs/public/demo is stale: run 'bun run demo:build' in docs/ and commit docs/public/demo"
            exit 1
          fi
      - name: Compile the C# snippets of the docs (tools/docs/DocCheck)
        run: dotnet run -c Release --project tools/docs/DocCheck

  native-aot:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Publish the battle server with Native AOT on both runtimes (tracked components, saves; warnings are errors)
        run: |
          dotnet publish tests/EasyEcs.Aot -c Release -r linux-x64 -f net10.0 -o artifacts/aot-net10.0
          dotnet publish tests/EasyEcs.Aot -c Release -r linux-x64 -f net11.0 -o artifacts/aot-net11.0
      - name: Run the native executables
        run: |
          artifacts/aot-net10.0/EasyEcs.Aot
          artifacts/aot-net11.0/EasyEcs.Aot

  godot:
    runs-on: ubuntu-26.04
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Download the Godot .NET editor
        run: |
          name=Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/${name}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run samples/Godot headless (must print its README's expected output)
        run: .github/scripts/check-sample.sh samples/Godot --ticks 120

  templates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # both runtimes the library targets; global.json picks the SDK (11)
          dotnet-version: |
            10.0.x
            11.0.x
      - name: dotnet new easyecs from the packed templates, against the packed EasyEcs
        run: templates/smoke.sh
