name: Release

# Run manually: Actions -> Release -> Run workflow (on master), enter the version (e.g. 4.0.0 or 4.1.0-preview.1).
#   tag:     bump <Version> in Directory.Build.props, build and test it, commit "Bump to vX.Y.Z", tag vX.Y.Z, push.
#   publish: from the tag, pack and push to NuGet (Trusted Publishing: a short-lived key from this workflow's OIDC
#            token, no stored secret), then create the GitHub release with GitHub's generated notes (What's Changed
#            from the merged pull requests, New Contributors, Full Changelog). If it fails, fix the cause and use
#            "Re-run failed jobs": the tag stays, NuGet skips a version it already has, the release is created once.
# Trusted Publishing policy on nuget.org: owner JasonXuDeveloper, repository EasyEcs, workflow release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 4.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (x.y.z or x.y.z-suffix)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists (to retry publishing, re-run the failed job of its run)"; exit 1
          fi

      - name: Bump version
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" Directory.Build.props
          grep -q "<Version>$VERSION</Version>" Directory.Build.props

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test the bumped version
        run: |
          dotnet build --configuration Release
          dotnet test --no-build --configuration Release

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- Directory.Build.props)" ]; then
            git commit -m "Bump to v$VERSION" -- Directory.Build.props
          fi
          git tag "v$VERSION"
          git push origin HEAD:master "v$VERSION"

  publish:
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token NuGet exchanges for a temporary API key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          dotnet build src/EasyEcs.Core/EasyEcs.Core.csproj --configuration Release
          dotnet pack src/EasyEcs.Core/EasyEcs.Core.csproj --no-build --configuration Release --output artifacts
          ls artifacts/EasyEcs.$VERSION.nupkg

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: JasonXuDeveloper # the nuget.org account that owns the policy

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "release v$VERSION exists"; exit 0; fi
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          # --notes goes first; the generated notes (pull requests since the previous tag) are appended.
          gh release create "v$VERSION" artifacts/*.nupkg --verify-tag --title "v$VERSION" $PRERELEASE \
            --notes "Install: \`dotnet add package EasyEcs --version $VERSION\`" --generate-notes
