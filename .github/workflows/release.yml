name: Release

# Run manually: Actions -> Release -> Run workflow (on master), enter the version (e.g. 4.0.0 or 4.1.0-preview.1).
# Builds and tests, publishes the package to NuGet (secret MYTOKEN), then commits the version bump, tags it and creates
# the GitHub release with notes generated from the commits since the previous tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 4.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (x.y.z or x.y.z-suffix)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release -p:Version=$VERSION
          dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack EasyEcs.Core/EasyEcs.Core.csproj --no-build --configuration Release -p:Version=$VERSION --output artifacts

      # Before anything is tagged: an invalid or expired key fails the run without leaving a half-made release.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.MYTOKEN }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "::error::secret MYTOKEN is not set"; exit 1; fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Commit version bump and tag
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" EasyEcs.Core/EasyEcs.Core.csproj
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "Bump to v$VERSION"
            git push origin HEAD:master
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Release notes
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}v$VERSION
          section() { # title, grep pattern on the subject
            local lines
            lines=$(git log "$RANGE" --no-merges --format='- %s (%h)' | grep -E "$2" | grep -v '^- Bump to v' || true)
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          # Grouped by the subject prefix used in this repository (logic commits have none).
          {
            echo "Install: \`dotnet add package EasyEcs --version $VERSION\`"
            echo
            section "Changes" '^- [^:]+$|^- [A-Z]'
            section "Performance" '^- (bench|perf):'
            section "Documentation" '^- docs:'
            section "Build and CI" '^- (ci|chore|build):'
            if [ -n "$PREVIOUS" ]; then echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS...v$VERSION"; fi
          } > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" artifacts/*.nupkg --title "v$VERSION" --notes-file notes.md $PRERELEASE
